<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Command Memo</title>
  <script src="https://cdn.jsdelivr.net/npm/sortablejs@latest/Sortable.min.js"></script>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      -webkit-tap-highlight-color: transparent;
    }
    body {
      background-color: #121212;
      color: #e0e0e0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, monospace, sans-serif;
      padding: 10px;
    }
    .container {
      width: 100%;
      max-width: 600px;
      margin: 0 auto;
      display: flex;
      flex-direction: column;
      gap: 12px;
    }
    .row {
      display: grid;
      grid-template-columns: 24px 30% 1fr;
      gap: 8px;
      width: 100%;
    }
    .input-row {
      display: grid;
      grid-template-columns: 30% 1fr;
      gap: 8px;
      padding-left: 32px;
    }
    .input-box, .display-box {
      background-color: #1e1e1e;
      border: 1px solid #444;
      border-radius: 6px;
      padding: 8px;
      font-size: 13px;
      color: #fff;
    }
    textarea.input-box {
      resize: none;
      height: 64px;
      outline: none;
      font-family: inherit;
    }
    textarea.input-box:focus {
      border-color: #777;
    }
    .btn-wrap {
      padding-left: 32px;
    }
    .btn-add {
      width: 100%;
      padding: 8px;
      background: #2a2a2a;
      border: 1px solid #555;
      color: #fff;
      border-radius: 6px;
      font-size: 13px;
      cursor: pointer;
    }
    .btn-add:active {
      background: #3a3a3a;
    }
    .item-row {
      align-items: stretch;
    }
    .drag-handle {
      display: flex;
      align-items: center;
      justify-content: center;
      color: #666;
      font-size: 18px;
      cursor: grab;
      touch-action: none;
    }
    .drag-handle:active {
      cursor: grabbing;
    }
    .cmd-box {
      font-family: monospace;
      word-break: break-all;
      background: #181818;
    }
    .desc-box {
      word-break: break-word;
      padding-right: 64px; /* ボタン2つ分のスペース */
      position: relative;
      white-space: pre-wrap;
    }
    .action-btns {
      position: absolute;
      top: 4px;
      right: 4px;
      display: flex;
      gap: 6px;
      z-index: 10;
    }
    .btn-icon {
      background: #2a2a2a;
      border: 1px solid #444;
      color: #ccc;
      font-size: 14px;
      width: 26px;
      height: 26px;
      border-radius: 4px;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
    }
    .btn-icon:active {
      background: #444;
    }
    .btn-icon.btn-edit { color: #4dabf7; }
    .btn-icon.btn-del { color: #ff6b6b; }
    .btn-icon.btn-save { color: #69db7c; }
    .sortable-ghost {
      opacity: 0.4;
      background-color: #2a2a2a;
      border-radius: 6px;
    }
  </style>
</head>
<body>

  <div class="container">
    <div class="input-row">
      <textarea id="new-cmd" class="input-box" placeholder="コマンド"></textarea>
      <textarea id="new-desc" class="input-box" placeholder="説明"></textarea>
    </div>
    <div class="btn-wrap">
      <button class="btn-add" id="btn-save">追加</button>
    </div>

    <div id="list" style="display:flex; flex-direction:column; gap:8px;"></div>
  </div>

  <script>
    const STORAGE_KEY = 'memo_app_commands_v2';
    const newCmd = document.getElementById('new-cmd');
    const newDesc = document.getElementById('new-desc');
    const btnSave = document.getElementById('btn-save');
    const list = document.getElementById('list');
    
    let editingIndex = null; // 現在編集中の行番号を保持

    function loadItems() {
      try {
        return JSON.parse(localStorage.getItem(STORAGE_KEY)) || [];
      } catch (e) {
        return [];
      }
    }

    function saveItems(items) {
      localStorage.setItem(STORAGE_KEY, JSON.stringify(items));
    }

    function render() {
      const items = loadItems();
      list.innerHTML = '';
      
      items.forEach((item, index) => {
        const row = document.createElement('div');
        row.className = 'row item-row';
        row.dataset.cmd = item.cmd;
        row.dataset.desc = item.desc;

        const handle = document.createElement('div');
        handle.className = 'drag-handle';
        handle.textContent = '≡';
        row.appendChild(handle);

        if (editingIndex === index) {
          // --- 編集モード ---
          const cmdInput = document.createElement('textarea');
          cmdInput.className = 'input-box cmd-box';
          cmdInput.value = item.cmd;

          const descWrap = document.createElement('div');
          descWrap.style.position = 'relative';
          descWrap.style.display = 'flex';
          descWrap.style.width = '100%';

          const descInput = document.createElement('textarea');
          descInput.className = 'input-box desc-box';
          descInput.style.width = '100%';
          descInput.value = item.desc;

          const actionWrap = document.createElement('div');
          actionWrap.className = 'action-btns';

          const saveBtn = document.createElement('button');
          saveBtn.className = 'btn-icon btn-save';
          saveBtn.innerHTML = '✓';
          saveBtn.onclick = () => {
            const currentItems = loadItems();
            currentItems[index].cmd = cmdInput.value.trim();
            currentItems[index].desc = descInput.value.trim();
            saveItems(currentItems);
            editingIndex = null;
            render();
          };

          const cancelBtn = document.createElement('button');
          cancelBtn.className = 'btn-icon btn-del';
          cancelBtn.innerHTML = '✕';
          cancelBtn.onclick = () => {
            editingIndex = null;
            render();
          };

          actionWrap.appendChild(saveBtn);
          actionWrap.appendChild(cancelBtn);
          descWrap.appendChild(descInput);
          descWrap.appendChild(actionWrap);

          row.appendChild(cmdInput);
          row.appendChild(descWrap);
        } else {
          // --- 通常モード ---
          const cmdEl = document.createElement('div');
          cmdEl.className = 'display-box cmd-box';
          cmdEl.textContent = item.cmd;

          const descEl = document.createElement('div');
          descEl.className = 'display-box desc-box';
          descEl.textContent = item.desc;

          const actionWrap = document.createElement('div');
          actionWrap.className = 'action-btns';

          const editBtn = document.createElement('button');
          editBtn.className = 'btn-icon btn-edit';
          editBtn.innerHTML = '✎';
          editBtn.onclick = () => {
            editingIndex = index;
            render();
          };

          const delBtn = document.createElement('button');
          delBtn.className = 'btn-icon btn-del';
          delBtn.innerHTML = '×';
          delBtn.onclick = () => {
            const currentItems = loadItems();
            currentItems.splice(index, 1);
            saveItems(currentItems);
            render();
          };

          actionWrap.appendChild(editBtn);
          actionWrap.appendChild(delBtn);
          descEl.appendChild(actionWrap);

          row.appendChild(cmdEl);
          row.appendChild(descEl);
        }
        
        list.appendChild(row);
      });
    }

    new Sortable(list, {
      handle: '.drag-handle',
      animation: 150,
      ghostClass: 'sortable-ghost',
      onEnd: function () {
        const rows = list.querySelectorAll('.item-row');
        const newOrder = Array.from(rows).map(row => ({
          cmd: row.dataset.cmd,
          desc: row.dataset.desc
        }));
        saveItems(newOrder);
        // ドラッグ終了後、編集中のインデックスがずれるのを防ぐためにリセット
        editingIndex = null; 
        render();
      }
    });

    btnSave.addEventListener('click', () => {
      const cmd = newCmd.value.trim();
      const desc = newDesc.value.trim();

      if (!cmd && !desc) return;

      const items = loadItems();
      items.unshift({ cmd, desc });
      saveItems(items);

      newCmd.value = '';
      newDesc.value = '';
      editingIndex = null;
      render();
    });

    render();
  </script>
</body>
</html>
