<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Command Memo</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      -webkit-tap-highlight-color: transparent;
    }
    body {
      background-color: #121212;
      color: #e0e0e0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, monospace, sans-serif;
      padding: 10px;
    }
    .container {
      width: 100%;
      max-width: 600px;
      margin: 0 auto;
      display: flex;
      flex-direction: column;
      gap: 8px;
    }
    /* 横並びを絶対に維持するグリッド設定 */
    .row {
      display: grid;
      grid-template-columns: 32% 1fr;
      gap: 8px;
      width: 100%;
    }
    .input-box, .display-box {
      background-color: #1e1e1e;
      border: 1px solid #444;
      border-radius: 6px;
      padding: 8px;
      font-size: 13px;
      color: #fff;
    }
    textarea.input-box {
      resize: none;
      height: 64px;
      outline: none;
      font-family: inherit;
    }
    textarea.input-box:focus {
      border-color: #777;
    }
    .btn-wrap {
      grid-column: 1 / -1;
      display: flex;
    }
    .btn-add {
      width: 100%;
      padding: 8px;
      background: #2a2a2a;
      border: 1px solid #555;
      color: #fff;
      border-radius: 6px;
      font-size: 13px;
      cursor: pointer;
    }
    .btn-add:active {
      background: #3a3a3a;
    }
    .item-row {
      position: relative;
    }
    .cmd-box {
      font-family: monospace;
      word-break: break-all;
      background: #181818;
    }
    .desc-box {
      word-break: break-word;
      padding-right: 28px;
      position: relative;
      white-space: pre-wrap;
    }
    .btn-del {
      position: absolute;
      top: 4px;
      right: 4px;
      background: transparent;
      border: none;
      color: #777;
      font-size: 16px;
      line-height: 1;
      padding: 4px;
      cursor: pointer;
    }
  </style>
</head>
<body>

  <div class="container">
    <!-- 最上段：入力マス -->
    <div class="row">
      <textarea id="new-cmd" class="input-box" placeholder="コマンド"></textarea>
      <textarea id="new-desc" class="input-box" placeholder="説明"></textarea>
    </div>
    <div class="btn-wrap">
      <button class="btn-add" id="btn-save">追加</button>
    </div>

    <!-- 一覧表示エリア -->
    <div id="list" style="display:flex; flex-direction:column; gap:8px;"></div>
  </div>

  <script>
    const STORAGE_KEY = 'memo_app_commands';
    const newCmd = document.getElementById('new-cmd');
    const newDesc = document.getElementById('new-desc');
    const btnSave = document.getElementById('btn-save');
    const list = document.getElementById('list');

    function loadItems() {
      try {
        return JSON.parse(localStorage.getItem(STORAGE_KEY)) || [];
      } catch (e) {
        return [];
      }
    }

    function saveItems(items) {
      localStorage.setItem(STORAGE_KEY, JSON.stringify(items));
    }

    function render() {
      const items = loadItems();
      list.innerHTML = '';
      items.forEach((item, index) => {
        const row = document.createElement('div');
        row.className = 'row item-row';

        const cmdEl = document.createElement('div');
        cmdEl.className = 'display-box cmd-box';
        cmdEl.textContent = item.cmd;

        const descEl = document.createElement('div');
        descEl.className = 'display-box desc-box';
        descEl.textContent = item.desc;

        const delBtn = document.createElement('button');
        delBtn.className = 'btn-del';
        delBtn.textContent = '×';
        delBtn.onclick = () => {
          items.splice(index, 1);
          saveItems(items);
          render();
        };

        descEl.appendChild(delBtn);
        row.appendChild(cmdEl);
        row.appendChild(descEl);
        list.appendChild(row);
      });
    }

    btnSave.addEventListener('click', () => {
      const cmd = newCmd.value.trim();
      const desc = newDesc.value.trim();

      if (!cmd && !desc) return;

      const items = loadItems();
      items.push({ cmd, desc });
      saveItems(items);

      newCmd.value = '';
      newDesc.value = '';
      render();
    });

    render();
  </script>
</body>
</html>
